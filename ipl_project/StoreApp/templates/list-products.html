<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            margin: 40px;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h2 {
            margin: 0;
        }

        .add-btn {
            padding: 8px 14px;
            border: 1px solid #222;
            text-decoration: none;
            color: #222;
            font-size: 14px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .product-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .product-row img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .product-info h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .product-info p {
            margin: 3px 0;
            font-size: 14px;
            color: #555;
        }

        .price {
            font-weight: 600;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<header>
    <h2>Products</h2>
    <a href="{% url 'add_product' %}" class="add-btn">+ Add Product</a>
</header>

<div class="product-list">
    {% for product in products %}
    <div class="product-row">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">

        <div class="product-info">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p class="price">₹{{ product.price }} | {{ product.discount }}% off</p>
        </div>
    </div>
    {% empty %}
    <p>No products available.</p>
    {% endfor %}
    
</div>

</body>
</html>
