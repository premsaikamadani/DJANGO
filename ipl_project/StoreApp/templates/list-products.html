<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            margin: 40px;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .add-btn {
            padding: 8px 14px;
            border: 1px solid #222;
            text-decoration: none;
            color: #222;
            font-size: 14px;
            border-radius: 4px;
        }

        .add-btn:hover {
            background: #222;
            color: #fff;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .product-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .product-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .product-row img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f5f5f5;
        }

        .product-info h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .product-info p {
            margin: 4px 0;
            font-size: 14px;
            color: #555;
        }

        .price {
            font-weight: 600;
            margin-top: 6px;
        }

        .actions {
            margin-left: 160px;
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .actions a,
        .actions button {
            font-size: 13px;
            border: 1px solid #222;
            padding: 4px 10px;
            background: none;
            cursor: pointer;
            border-radius: 4px;
            color: #222;
        }

        .actions a:hover {
            background: #222;
            color: #fff;
        }

        .actions button:hover {
            background: #b00020;
            color: #fff;
            border-color: #b00020;
        }
    </style>
</head>

<body>

<header>
    <h2>Products</h2>
    <a href="{% url 'add_product' %}" class="add-btn">+ Add Product</a>
</header>

<div class="product-list">

    {% for product in products %}
    <div class="product-item">

        <!-- Product clickable -->
        <a href="{% url 'product_detail' product.id %}" class="product-link">
            <div class="product-row">

                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                    <img src="https://via.placeholder.com/140" alt="No image">
                {% endif %}

                <div class="product-info">
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.description|truncatewords:20 }}</p>
                    <p class="price">₹{{ product.price }}</p>
                </div>

            </div>
        </a>

        <!-- Actions -->
        <div class="actions">
            <a href="{% url 'update_product' product.id %}">Edit</a>

            <form method="post" action="{% url 'delete_product' product.id %}"
                  onsubmit="return confirm('Are you sure you want to delete this product?');">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
        </div>

    </div>
    {% empty %}
        <p>No products available.</p>
    {% endfor %}

</div>

</body>
</html>
