<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stadium List</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            text-transform: capitalize;
        }

        table {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        thead {
            background: #0d6efd;
            color: #fff;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 14px;
            color: #333;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #f1f5ff;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        /* Back Button */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #0d6efd;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.25);
        }

        .back-link:hover {
            background-color: #084298;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(13, 110, 253, 0.35);
        }

        .back-link:active {
            transform: scale(0.96);
        }

        /* Mobile */
        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <h2>Stadium List</h2>

    <a href="{% url 'register_stadium' %}" class="back-link">
        Back to Register Stadium
    </a>

    {% if stadiums %}
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>City</th>
                    <th>Capacity</th>
                    <th>Home Team</th>
                </tr>
            </thead>

            <tbody>
                {% for stadium in stadiums %}
                <tr>
                    <td>
                        <a href="{% url 'franchise_details' stadium.id %}">
                            {{ stadium.name }}
                        </a>
                    </td>
                    <td>{{ stadium.city }}</td>
                    <td>{{ stadium.capacity }}</td>
                    <td>{{ stadium.home_team }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p style="text-align:center;">No stadiums registered yet.</p>
    {% endif %}

</body>
</html>
